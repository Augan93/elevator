<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лифт</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <h1>Лифт</h1>
        <p>12 этажей · один лифт · алгоритм LOOK</p>
      </div>
      <div class="controls">
        <label for="count">Пассажиров</label>
        <input id="count" type="number" min="1" max="8" value="3">
        <button id="reset" type="button">Создать заново</button>
        <span class="divider"></span>
        <label class="toggle"><input id="auto" type="checkbox"> Автопоток</label>
        <select id="rate" aria-label="Интенсивность автопотока">
          <option value="low">редко</option>
          <option value="mid" selected>средне</option>
          <option value="high">часто</option>
        </select>
        <span class="divider"></span>
        <label class="toggle"><input id="sound" type="checkbox" checked> Звук</label>
      </div>
    </header>
    <main id="app" class="stage"></main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/elevator.js"></script>
  <script src="js/passenger.js"></script>
  <script src="js/traffic.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/building.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/sketch.js"></script>
</body>
</html>
